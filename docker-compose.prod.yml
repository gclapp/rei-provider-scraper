version: '3.8'

services:
  rei-scraper:
    build: .
    container_name: rei-provider-scraper
    environment:
      - SECRET_KEY=${SECRET_KEY:-rei-scraper-secret-key-change-in-production}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - rei-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: rei-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - rei-scraper
    restart: unless-stopped
    networks:
      - rei-network

  certbot:
    image: certbot/certbot
    container_name: rei-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - rei-network

networks:
  rei-network:
    driver: bridge
